[project]
name = "advent2025"
version = "0.1.0"
description = "Advent of Code 2025 solutions"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.0.2",
    "requests>=2.32.5",
    "shapely>=2.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "day0"]
python_files = ["test_*.py"]

[tool.uv]
dev-dependencies = []
